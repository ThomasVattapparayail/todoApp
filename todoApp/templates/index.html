{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Todo App</title>
</head>
<body>
  <h1 class="text-center">TODO APP</h1>
  <div class="container text-center">
    <div class="row">
     <div class="form-attributes col-md-6 offset-md-3 ">
      <form method="POST">
        {% csrf_token %}
        {{form}}
        <button type="submit" class="btn btn-primary">submit</button>
      </form>
      </div>
      
      <div class="col-md-6 offset-md-3 ">
        <br>
        <br>
        <br>
            <table class="table space" border="1">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Todo Name</th>
                        <th>Todo Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in form_data %}
                    <tr>
                        <td>{{d.id}}</td>
                        <td><span class="{% if d.done == 1 %}todo-done{% endif %}">{{ d.todo }}</span></td>
                        <td><span class="{% if d.done == 1 %}todo-done{% endif %}">{{d.todo_dis}}</span></td>
                        <td>

                            <form action="{% url 'done' d.id %}" method="POST">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-success btn-sm">
                                    Done
                                </button>
                            </form>
                            
                            <a href="{% url 'edit' d.id %}" class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <form action="{% url 'delete' d.id %}" method="POST" style="display:inline;">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger btn-sm">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
  </div>  
</body>
</html>
