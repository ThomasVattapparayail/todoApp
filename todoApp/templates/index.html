{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <title>Todo App</title>
</head>
<body>
  <h1 class="text-center">TODO APP</h1>
  <div class="container text-center">
    <div class="row">
     <div class="form-attributes col-md-6 offset-md-3 ">
      <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="todo" class="form-label">Todo Name</label>
                <input
                    type="text"
                    name="todo"
                    id="todo"
                    class="form-control"
                    placeholder="Enter todo"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="todo_dis" class="form-label">Description</label>
                <textarea
                    name="todo_dis"
                    id="todo_dis"
                    class="form-control"
                    placeholder="Enter description"
                    rows="3"
                ></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>
        </form>

      </div>
      
      <div class="col-md-6 offset-md-3 ">
        <br>
        <br>
        <br>
            <table class="table space" border="1">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Todo Name</th>
                        <th>Todo Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in form_data %}
                    <tr>
                        <td>{{d.id}}</td>
                        <td><span class="{% if d.done == 1 %}todo-done{% endif %}">{{ d.todo }}</span></td>
                        <td><span class="{% if d.done == 1 %}todo-done{% endif %}">{{d.todo_dis}}</span></td>
                        <td>

                            <form action="{% url 'done' d.id %}" method="POST">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-success btn-sm">
                                    Done
                                </button>
                            </form>
                            
                            <button  class="btn btn-warning btn-sm" onclick="edit('{{d.id}}','{{d.todo}}','{{d.todo_dis}}')">
                                Edit
                            </button>

                            <form action="{% url 'delete' d.id %}" method="POST" style="display:inline;">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger btn-sm">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
  </div>
   <!--Modals--->

    <div class="modal fade" id="editModal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" >
                            Edit Todo
                        </h5>

                       <button
                            type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Close"
                        >
                            <span aria-hidden="true">&times;</span>
                        </button>

                    </div>

                    <div class="modal-body">

                        <form  method="POST" id="editTodoForm">
                            {% csrf_token %}

                            <input
                                    type="hidden"
                                    class="form-control"
                                    id="edit_id"
                                    name="todo"
                                    value=""
                                    required
                                >

                            <div class="mb-3">
                                <label for="todo_label" class="form-label">
                                    Todo
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="edit_todo"
                                    name="todo"
                                    value=""
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="todo_dis_label" class="form-label">
                                    Description
                                </label>

                                <textarea
                                    class="form-control"
                                    id="edit_todo_dis"
                                    name="todo_dis"
                                    rows="3"
                                ></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Update
                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-dismiss="modal"
                            >
                                Cancel
                            </button>

                        </form>

                    </div>
                </div>
            </div>
        </div>
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="{% static 'js/edit.js' %}"></script>  
</body>
</html>
